apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: frontend
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: frontend
  template:
    metadata:
      labels:
        io.kompose.service: frontend
    spec:
      containers:
        - image: bank-frontend:latest
          imagePullPolicy: IfNotPresent
          name: csb-frontend
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
