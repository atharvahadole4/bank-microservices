apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Users\Microsoft\AppData\Local\Programs\DockerDesktop\resources\bin\kompose.exe convert -f docker-compose.yml -o k8s/
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: authservice
  name: authservice
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: authservice
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Users\Microsoft\AppData\Local\Programs\DockerDesktop\resources\bin\kompose.exe convert -f docker-compose.yml -o k8s/
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: authservice
    spec:
      containers:
        - env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discoveryservice:8761/eureka/
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx256m
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/csb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
          image: auth-service:latest
          imagePullPolicy: IfNotPresent
          name: csb-auth
          ports:
            - containerPort: 9898
              protocol: TCP
      restartPolicy: Always
