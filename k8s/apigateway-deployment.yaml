apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: apigateway
  name: apigateway
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: apigateway
  template:
    metadata:
      labels:
        io.kompose.service: apigateway
    spec:
      containers:
        - env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discoveryservice:8761/eureka/
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx256m
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          name: csb-gateway
          ports:
            - containerPort: 8765
              protocol: TCP
      restartPolicy: Always
