apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: frontend
  name: frontend
spec:
  type: LoadBalancer
  ports:
    - name: "http"
      port: 3000
      targetPort: 80
      nodePort: 30000
    - name: "nodeport"
      port: 30000
      targetPort: 80
  selector:
    io.kompose.service: frontend
