apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: customerservice
  name: customerservice
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: customerservice
  template:
    metadata:
      labels:
        io.kompose.service: customerservice
    spec:
      containers:
        - env:
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: http://discoveryservice:8761/eureka/
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discoveryservice:8761/eureka/
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx256m -Deureka.client.serviceUrl.defaultZone=http://discoveryservice:8761/eureka/
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/csb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
          image: customer-service:latest
          imagePullPolicy: IfNotPresent
          name: csb-customer
          ports:
            - containerPort: 8081
              protocol: TCP
      restartPolicy: Always
