services:
  mysql:
    image: mysql:8.0
    container_name: csb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: csb
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - bank-net

  discoveryservice:
    build:
      context: ./DiscoveryService
    image: discoveryservice:latest
    container_name: csb-discovery
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "8761:8761"
    restart: unless-stopped
    networks:
      - bank-net

  accountservice:
    build:
      context: ./AccountService
    image: accountservice:latest
    container_name: csb-account
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/csb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      discoveryservice:
        condition: service_started
    restart: unless-stopped
    networks:
      - bank-net

  customerservice:
    build:
      context: ./CustomerService
    image: customer-service:latest
    container_name: csb-customer
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/csb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    ports:
      - "8091:8081"
    depends_on:
      mysql:
        condition: service_healthy
      discoveryservice:
        condition: service_started
    restart: unless-stopped
    networks:
      - bank-net

  authservice:
    build:
      context: ./AuthService
    image: auth-service:latest
    container_name: csb-auth
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/csb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    ports:
      - "9898:9898"
    depends_on:
      mysql:
        condition: service_healthy
      discoveryservice:
        condition: service_started
    restart: unless-stopped
    networks:
      - bank-net

  apigateway:
    build:
      context: ./ApiGateway
    image: api-gateway:latest
    container_name: csb-gateway
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    ports:
      - "8765:8765"
    depends_on:
      discoveryservice:
        condition: service_started
    restart: unless-stopped
    networks:
      - bank-net

  frontend:
    build:
      context: ./Frontend
    image: bank-frontend:latest
    container_name: csb-frontend
    ports:
      - "3000:80"
    depends_on:
      apigateway:
        condition: service_started
      authservice:
        condition: service_started
    restart: unless-stopped
    networks:
      - bank-net

networks:
  bank-net:
    driver: bridge
