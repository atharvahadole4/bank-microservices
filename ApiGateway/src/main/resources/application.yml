spring:
  application:
    name: BANK-GATEWAY
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:30000"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:30000"
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://customerservice:8081}
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - AuthenticationFilter

        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://accountservice:8082}
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/savings/**
          filters:
            - AuthenticationFilter

        - id: authentication-service
          uri: ${AUTH_SERVICE_URL:http://authservice:9898}
          predicates:
            - Path=/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://discoveryservice:8761/eureka/
