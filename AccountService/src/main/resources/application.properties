spring.application.name=AccountService
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/csb
spring.datasource.username=root
spring.datasource.password=HarshalDB

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.deserialization.fail-on-unknown-properties=true

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discoveryservice:8761/eureka/}
eureka.instance.prefer-ip-address=true